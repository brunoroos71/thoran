# Config mínima para `supabase start` / `supabase functions serve`.
project_id = "thoran"

[auth]
site_url = "env(SITE_URL)"
additional_redirect_urls = ["https://thoran-rho.vercel.app/app", "https://thoran-rho.vercel.app/nova-senha", "https://thoran.com.br/app", "https://thoran.com.br/nova-senha", "http://localhost:5173/app", "http://localhost:5173/nova-senha"]

[auth.email]
enable_signup = true
# sem confirmação por e-mail: quem pergunta na home recebe a resposta na hora (menos atrito)
enable_confirmations = false

[auth.external.google]
# ligue depois de criar as credenciais OAuth no Google Cloud (e VITE_GOOGLE_AUTH=true no front)
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[functions.waitlist-join]
verify_jwt = false   # público; protegido por honeypot + limite por IP

[functions.admin-waitlist]
verify_jwt = true

[functions.agent-proxy]
verify_jwt = true

[functions.market-data]
verify_jwt = false   # público; lista fechada de símbolos + cache de 60 s

[functions.billing]
verify_jwt = true

[functions.billing-webhook]
verify_jwt = false   # autenticado pela assinatura do gateway

[functions.billing-cron]
verify_jwt = false   # protegido por CRON_SECRET
